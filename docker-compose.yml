version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: cashflow-db
    restart: always
    environment:
      POSTGRES_USER: cashflow_admin
      POSTGRES_PASSWORD: cashflow_password
      POSTGRES_DB: cashflow_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
